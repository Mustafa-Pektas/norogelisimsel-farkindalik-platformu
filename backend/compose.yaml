name: norogelisim

services:
  backend:
    image: norogelisim-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      BACKEND_MODE: deployment
      NODE_ENV: production
      PORT: "8000"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 4s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.7-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in backend/.env}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
    name: norogelisim_caddy_data
  caddy_config:
    name: norogelisim_caddy_config
